---
- name: Check existence of Static Web Server systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ static_web_server_identifier }}.service"
  register: static_web_server_service_stat

- name: Uninstall Static Web Server systemd services and files
  when: static_web_server_service_stat.stat.exists | bool
  block:
    - name: Ensure Static Web Server systemd service is stopped
      ansible.builtin.service:
        name: "{{ static_web_server_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure Static Web Server systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ static_web_server_identifier }}.service"
        state: absent

    - name: Ensure Static Web Server container network does not exist
      when: static_web_server_container_network_deletion_enabled
      block:
        - name: Ensure Static Web Server container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ static_web_server_container_network }}"
            state: absent
          register: static_web_server_network_deletion_result

        - name: Ensure Static Web Server container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ static_web_server_container_network }}
          register: static_web_server_network_deletion_result
          changed_when: static_web_server_container_network in static_web_server_network_deletion_result.stdout

    - name: Ensure Static Web Server path does not exist
      ansible.builtin.file:
        path: "{{ static_web_server_base_path }}"
        state: absent
