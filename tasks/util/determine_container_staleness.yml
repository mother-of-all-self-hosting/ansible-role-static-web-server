---
# Determines whether the currently running Converse container is stale,
# i.e. it was created from an older version of its configuration (env file, labels, systemd unit) or from an older image.
#
# A container's configuration is frozen at creation time, so changes to these files only take effect after a restart.
# If a previous run changed them but did not manage to restart the service (e.g. because it failed midway),
# subsequent runs would not see any changes and would never restart the service on their own.
#
# Sets `converse_container_stale` (bool).

- name: Inspect the Converse container
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} inspect --type=container {{ converse_identifier }}"
  register: converse_container_staleness_container_inspect_result
  changed_when: false
  failed_when: false
  check_mode: false
  # The output contains the container's environment variables, which include secrets.
  no_log: true

- name: Determine Converse container facts
  vars:
    container: "{{ (converse_container_staleness_container_inspect_result.stdout | from_json | first) if converse_container_staleness_container_inspect_result.rc == 0 else {} }}"
    # `Created` looks like `2026-01-02T03:04:05.123456789Z` (always UTC, trailing zeros in the fractional part may be omitted).
    container_created: "{{ container.Created | default('1970-01-01T00:00:00Z') }}"
    container_created_fraction: "{{ container_created | regex_search('\\.([0-9]+)', '\\1') | default([], true) | first | default('0') }}"
  ansible.builtin.set_fact:
    converse_container_staleness_container_running: "{{ container.State.Running | default(false) | bool }}"
    converse_container_staleness_container_created_timestamp: >-
      {{
        ((container_created[:19] ~ '+0000') | to_datetime('%Y-%m-%dT%H:%M:%S%z')).timestamp() | int
        + ('0.' ~ container_created_fraction[:6]) | float
      }}
    converse_container_staleness_container_image_id: "{{ container.Image | default('') }}"

- name: Inspect the Converse container image and files, if the container is running
  when: converse_container_staleness_container_running | bool
  block:
    - name: Inspect the Converse container image
      vars:
        # The same image that the systemd service creates the container from.
        image: "{{ converse_container_image_self_build_name }}"
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} image inspect --format={{ '{{' }}.Id{{ '}}' }} {{ image }}"
      register: converse_container_staleness_image_inspect_result
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check Converse files that affect the container
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      register: converse_container_staleness_file_stat_results
      loop:
        - "{{ converse_base_path }}/env"
        - "{{ converse_base_path }}/labels"
        - "{{ devture_systemd_docker_base_systemd_path }}/{{ converse_identifier }}.service"

- name: Determine whether the Converse container is stale
  ansible.builtin.set_fact:
    converse_container_stale: >-
      {{
        converse_container_staleness_container_running | bool
        and (
          (
            converse_container_staleness_image_inspect_result.rc == 0
            and converse_container_staleness_image_inspect_result.stdout | trim != converse_container_staleness_container_image_id
          )
          or
          (
            converse_container_staleness_file_stat_results.results
            | selectattr('stat.exists')
            | map(attribute='stat.mtime')
            | map('float')
            | select('gt', converse_container_staleness_container_created_timestamp | float)
            | list
            | length > 0
          )
        )
      }}
