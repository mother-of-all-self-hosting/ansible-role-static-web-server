---
- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "converse_container_labels_middleware_basic_auth_enabled", "new": "converse_container_labels_traefik_middleware_basic_auth_enabled" }
    - { "old": "converse_container_labels_middleware_basic_auth_users", "new": "converse_container_labels_traefik_middleware_basic_auth_users" }

- name: Fail if required Converse settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - converse_uid
    - converse_gid
    - converse_hostname
    - converse_path_prefix
    - converse_container_network

- name: Fail if Converse light theme type invalid
  ansible.builtin.fail:
    msg: >-
      converse_config_initialize_theme must be 'classic', 'cyberpunk', 'dracula', or 'nordic'
  when: "converse_config_initialize_theme not in ['classic', 'cyberpunk', 'dracula', 'nordic']"

- name: Fail if Converse dark theme type sinvalid
  ansible.builtin.fail:
    msg: >-
      converse_config_initialize_dark_theme must be 'classic', 'cyberpunk', 'dracula', or 'nordic'
  when: "converse_config_initialize_dark_theme not in ['classic', 'cyberpunk', 'dracula', 'nordic']"

- name: Fail if logging level of Static Web Server for Converse is invalid
  ansible.builtin.fail:
    msg: >-
      converse_environment_variables_server_log_level must be 'debug', 'error', 'info', 'trace', or 'warn'
  when: "converse_environment_variables_server_log_level not in ['debug', 'error', 'info', 'trace', 'warn']"

- name: Run if Traefik is enabled
  when: converse_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Converse are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "converse_container_labels_traefik_hostname", when: true }
        - { "name": "converse_container_labels_traefik_path_prefix", when: true }
        - { "name": "converse_container_labels_traefik_middleware_basic_auth_users", when: "{{ converse_container_labels_traefik_middleware_basic_auth_enabled }}" }

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `converse_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if converse_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          converse_container_labels_traefik_path_prefix (`{{ converse_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/converse`).
      when: "converse_container_labels_traefik_path_prefix != '/' and converse_container_labels_traefik_path_prefix[-1] == '/'"
