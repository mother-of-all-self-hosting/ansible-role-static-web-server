---
- name: Perform Converse installation tasks
  when: converse_enabled | bool
  tags:
    - setup-all
    - setup-converse
    - install-all
    - install-converse
  block:
    - name: Validate Converse configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install Converse
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform Converse uninstallation tasks
  when: not converse_enabled | bool
  tags:
    - setup-all
    - setup-converse
  block:
    - name: Uninstall Converse
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
