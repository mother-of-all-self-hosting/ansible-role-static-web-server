---
- name: Perform Static Web Server installation tasks
  when: static_web_server_enabled | bool
  tags:
    - setup-all
    - setup-static-web-server
    - install-all
    - install-static-web-server
  block:
    - name: Validate Static Web Server configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install Static Web Server
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform Static Web Server uninstallation tasks
  when: not static_web_server_enabled | bool
  tags:
    - setup-all
    - setup-static-web-server
  block:
    - name: Uninstall Static Web Server
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
