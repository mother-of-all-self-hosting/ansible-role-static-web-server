---
# Project source code URL: https://github.com/conversejs/converse.js

converse_enabled: true

converse_identifier: converse
converse_base_path: "/{{ converse_identifier }}"
converse_src_path: "{{ converse_base_path }}/src"

converse_version: v14.0.1

converse_uid: ""
converse_gid: ""

# The scheme used for serving Converse.
converse_scheme: https

# The hostname at which Converse is served.
converse_hostname: ""

# The path at which Converse is served.
# This value must either be `/` or not end with a slash (e.g. `/converse`).
converse_path_prefix: /

# NOTE: the Docker image is not provided by the developers
converse_container_image_self_build_name: "conversejs/conversejs:{{ converse_container_image_self_build_repo_version }}"
converse_container_image_self_build_repo: "https://github.com/conversejs/converse.js"
converse_container_image_self_build_repo_version: "{{ converse_version if converse_version != 'latest' else 'master' }}"
converse_container_image_self_build_src_files_path: "{{ converse_base_path }}/docker-src"
converse_container_image_self_build_base_image: "{{ converse_container_image_self_build_base_image_name }}:{{ converse_container_image_self_build_base_image_tag }}"
converse_container_image_self_build_base_image_name: joseluisq/static-web-server
converse_container_image_self_build_base_image_tag: 2.44.1

# The base container network. It will be auto-created by this role if it doesn't exist already.
converse_container_network: "{{ converse_identifier }}"

# Control if the container network is deleted on uninstalling.
converse_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `converse_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
converse_container_http_host_bind_port: ""

# The port number in the container
converse_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
converse_container_additional_networks: "{{ converse_container_additional_networks_auto + converse_container_additional_networks_custom }}"
converse_container_additional_networks_auto: []
converse_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
converse_container_additional_volumes: "{{ converse_container_additional_volumes_auto + converse_container_additional_volumes_custom }}"
converse_container_additional_volumes_auto: []
converse_container_additional_volumes_custom: []

# converse_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `converse_container_labels_additional_labels_custom`.
converse_container_labels_traefik_enabled: true
converse_container_labels_traefik_docker_network: "{{ converse_container_network }}"
converse_container_labels_traefik_hostname: "{{ converse_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/converse`).
converse_container_labels_traefik_path_prefix: "{{ converse_path_prefix }}"
converse_container_labels_traefik_rule: "Host(`{{ converse_container_labels_traefik_hostname }}`){% if converse_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ converse_container_labels_traefik_path_prefix }}`){% endif %}"
converse_container_labels_traefik_priority: 0
converse_container_labels_traefik_entrypoints: web-secure
converse_container_labels_traefik_tls: "{{ converse_container_labels_traefik_entrypoints != 'web' }}"
converse_container_labels_traefik_tls_certResolver: default  # noqa var-naming
converse_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
converse_container_labels_traefik_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `converse_container_labels_traefik_additional_request_headers_custom`
converse_container_labels_traefik_additional_request_headers: "{{ converse_container_labels_traefik_additional_request_headers_auto | combine(converse_container_labels_traefik_additional_request_headers_custom) }}"
converse_container_labels_traefik_additional_request_headers_auto: {}
converse_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `converse_container_labels_traefik_additional_response_headers_custom`
converse_container_labels_traefik_additional_response_headers: "{{ converse_container_labels_traefik_additional_response_headers_auto | combine(converse_container_labels_traefik_additional_response_headers_custom) }}"
converse_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': converse_http_header_xss_protection} if converse_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': converse_http_header_content_type_options} if converse_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': converse_http_header_content_security_policy} if converse_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': converse_http_header_permissions_policy} if converse_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': converse_http_header_strict_transport_security} if converse_http_header_strict_transport_security and converse_container_labels_traefik_tls else {})
  }}
converse_container_labels_traefik_additional_response_headers_custom: {}

# converse_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `converse_container_labels_additional_labels_custom`
#
# Example:
# converse_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
converse_container_labels_additional_labels: "{{ converse_container_labels_additional_labels_auto + converse_container_labels_additional_labels_custom }}"
converse_container_labels_additional_labels_auto: []
converse_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
converse_container_extra_arguments: "{{ converse_container_extra_arguments_auto + converse_container_extra_arguments_custom }}"
converse_container_extra_arguments_auto: []
converse_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
converse_process_extra_arguments: "{{ converse_process_extra_arguments_auto + converse_process_extra_arguments_custom }}"
converse_process_extra_arguments_auto: []
converse_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
converse_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
converse_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
converse_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
converse_http_header_permissions_policy: "{{ 'interest-cohort=()' if converse_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
converse_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if converse_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `converse_http_header_permissions_policy`
converse_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `converse_http_header_strict_transport_security`
converse_hsts_preload_enabled: false

# List of systemd services that the Converse systemd service depends on
converse_systemd_required_services_list: "{{ converse_systemd_required_services_list_default + converse_systemd_required_services_list_auto + converse_systemd_required_services_list_custom }}"
converse_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
converse_systemd_required_services_list_auto: []
converse_systemd_required_services_list_custom: []

# List of systemd services that the Converse systemd service wants
converse_systemd_wanted_services_list: "{{ converse_systemd_wanted_services_list_default + converse_systemd_wanted_services_list_auto + converse_systemd_wanted_services_list_custom }}"
converse_systemd_wanted_services_list_default: []
converse_systemd_wanted_services_list_auto: []
converse_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
converse_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
converse_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
converse_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
converse_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ converse_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ converse_container_stop_grace_time_seconds }} {{ converse_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ converse_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ converse_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ converse_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ converse_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ converse_identifier }} after {{ converse_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Control if analytics is enabled
converse_analytics_enabled: false

# Control if initialization options in converse.initialize are unset
converse_config_initialize_custom_enabled: false

# Specify custom initialization options in converse.initialize
converse_config_initialize_custom: ""

# Specify theme
# Valid values: classic, cyberpunk, dracula, nordic
converse_config_initialize_theme: classic

# Specify dark theme
# Valid values: classic, cyberpunk, dracula, nordic
converse_config_initialize_dark_theme: dracula

# Specify authentication option
# Valid values: login, external, anonymous, prebind
converse_config_initialize_authentication: login

# Specify the amount of seconds after which the user’s presence status should automatically become `away`
# Set `0` to disable this option
converse_config_initialize_auto_away: 0

# Control if automatically reconnect to the XMPP server if the connection drops unexpectedly
converse_config_initialize_auto_reconnect: true

# Specify a BOSH connection manager which acts as a middle man between the HTTP and XMPP protocols
converse_config_initialize_bosh_service_url: ""

# Specify log level
# Valid values: debug, error, fatal, info, warn
converse_config_initialize_loglevel: info

# Control if XEP-0313 (Message Archive Management) is supported
converse_config_initialize_message_archiving: always

# Control if notification sound is played on a personal message or your nickname being mentioned in a room
converse_config_initialize_play_sounds: true

# Control if OMEMO encryption is used by default when the chat supports it
converse_config_initialize_omemo_default: true

# Specify the view_mode setting configures Converse’s mode and resulting behavior
# Valid values: fullscreen, overlayed [sic], embedded
converse_config_initialize_view_mode: fullscreen

# Specify WebSocket URI, which Converse can connect to
converse_config_initialize_websocket_url: ""

# Control if a background with the Converse logo is displayed
converse_config_initialize_show_background: false

# Specify the timezone
converse_environment_variables_tz: UTC

# Specify a logging level
# Valid values: debug, error, info, trace, warn
converse_environment_variables_server_log_level: info

converse_environment_variables_server_root: /public

# Additional environment variables.
converse_environment_variables_additional_variables: ""

# converse_restart_necessary controls whether the Converse systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed,
# or whether the running container was created from an older configuration or image.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
converse_restart_necessary: false
