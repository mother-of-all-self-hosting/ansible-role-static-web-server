---
# Project source code URL: https://github.com/static-web-server/static-web-server

static_web_server_enabled: true

static_web_server_identifier: static-web-server
static_web_server_base_path: "/{{ static_web_server_identifier }}"

# renovate: datasource=docker depName=joseluisq/static-web-server
static_web_server_version: 3.0.0-beta.2

static_web_server_uid: ""
static_web_server_gid: ""

# The scheme used for serving Static Web Server.
static_web_server_scheme: https

# The hostname at which Static Web Server is served.
static_web_server_hostname: ""

# The path at which Static Web Server is served.
# This value must either be `/` or not end with a slash (e.g. `/static-web-server`).
static_web_server_path_prefix: /

static_web_server_container_image: "{{ static_web_server_container_image_registry_prefix }}joseluisq/static-web-server:{{ static_web_server_container_image_tag }}"
static_web_server_container_image_tag: "{{ static_web_server_version }}"
static_web_server_container_image_registry_prefix: "{{ static_web_server_container_image_registry_prefix_upstream }}"
static_web_server_container_image_registry_prefix_upstream: "{{ static_web_server_container_image_registry_prefix_upstream_default }}"
static_web_server_container_image_registry_prefix_upstream_default: docker.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
static_web_server_container_network: "{{ static_web_server_identifier }}"

# Control if the container network is deleted on uninstalling.
static_web_server_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `static_web_server_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
static_web_server_container_http_host_bind_port: ""

# The port number in the container
static_web_server_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
static_web_server_container_additional_networks: "{{ static_web_server_container_additional_networks_auto + static_web_server_container_additional_networks_custom }}"
static_web_server_container_additional_networks_auto: []
static_web_server_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
static_web_server_container_additional_volumes: "{{ static_web_server_container_additional_volumes_auto + static_web_server_container_additional_volumes_custom }}"
static_web_server_container_additional_volumes_auto: []
static_web_server_container_additional_volumes_custom: []

# static_web_server_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `static_web_server_container_labels_additional_labels_custom`.
static_web_server_container_labels_traefik_enabled: true
static_web_server_container_labels_traefik_docker_network: "{{ static_web_server_container_network }}"
static_web_server_container_labels_traefik_hostname: "{{ static_web_server_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/static-web-server`).
static_web_server_container_labels_traefik_path_prefix: "{{ static_web_server_path_prefix }}"
static_web_server_container_labels_traefik_rule: "Host(`{{ static_web_server_container_labels_traefik_hostname }}`){% if static_web_server_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ static_web_server_container_labels_traefik_path_prefix }}`){% endif %}"
static_web_server_container_labels_traefik_priority: 0
static_web_server_container_labels_traefik_entrypoints: web-secure
static_web_server_container_labels_traefik_tls: "{{ static_web_server_container_labels_traefik_entrypoints != 'web' }}"
static_web_server_container_labels_traefik_tls_certResolver: default  # noqa var-naming
static_web_server_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
static_web_server_container_labels_traefik_middleware_basic_auth_users: ""

# Controls if labels are added to expose the Prometheus metrics publicly.
static_web_server_container_labels_traefik_metrics_enabled: "{{ static_web_server_environment_variables_server_metrics }}"
static_web_server_container_labels_traefik_metrics_hostname: "{{ static_web_server_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/metrics`).
static_web_server_container_labels_traefik_metrics_path_prefix: /metrics
static_web_server_container_labels_traefik_metrics_rule: "Host(`{{ static_web_server_container_labels_traefik_metrics_hostname }}`){% if static_web_server_container_labels_traefik_metrics_path_prefix != '/' %} && PathPrefix(`{{ static_web_server_container_labels_traefik_metrics_path_prefix }}`){% endif %}"
static_web_server_container_labels_traefik_metrics_priority: 0
static_web_server_container_labels_traefik_metrics_entrypoints: "{{ static_web_server_container_labels_traefik_entrypoints }}"
static_web_server_container_labels_traefik_metrics_middlewares: []
static_web_server_container_labels_traefik_metrics_tls: "{{ static_web_server_container_labels_traefik_metrics_entrypoints != 'web' }}"
static_web_server_container_labels_traefik_metrics_tls_certResolver: "{{ static_web_server_container_labels_traefik_tls_certResolver }}"  # noqa var-naming
static_web_server_container_labels_traefik_metrics_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
static_web_server_container_labels_traefik_metrics_middleware_basic_auth_users: ""

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `static_web_server_container_labels_traefik_additional_request_headers_custom`
static_web_server_container_labels_traefik_additional_request_headers: "{{ static_web_server_container_labels_traefik_additional_request_headers_auto | combine(static_web_server_container_labels_traefik_additional_request_headers_custom) }}"
static_web_server_container_labels_traefik_additional_request_headers_auto: {}
static_web_server_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `static_web_server_container_labels_traefik_additional_response_headers_custom`
static_web_server_container_labels_traefik_additional_response_headers: "{{ static_web_server_container_labels_traefik_additional_response_headers_auto | combine(static_web_server_container_labels_traefik_additional_response_headers_custom) }}"
static_web_server_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': static_web_server_http_header_xss_protection} if static_web_server_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': static_web_server_http_header_content_type_options} if static_web_server_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': static_web_server_http_header_content_security_policy} if static_web_server_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': static_web_server_http_header_permissions_policy} if static_web_server_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': static_web_server_http_header_strict_transport_security} if static_web_server_http_header_strict_transport_security and static_web_server_container_labels_traefik_tls else {})
  }}
static_web_server_container_labels_traefik_additional_response_headers_custom: {}

# static_web_server_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `static_web_server_container_labels_additional_labels_custom`
#
# Example:
# static_web_server_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
static_web_server_container_labels_additional_labels: "{{ static_web_server_container_labels_additional_labels_auto + static_web_server_container_labels_additional_labels_custom }}"
static_web_server_container_labels_additional_labels_auto: []
static_web_server_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
static_web_server_container_extra_arguments: "{{ static_web_server_container_extra_arguments_auto + static_web_server_container_extra_arguments_custom }}"
static_web_server_container_extra_arguments_auto: []
static_web_server_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
static_web_server_process_extra_arguments: "{{ static_web_server_process_extra_arguments_auto + static_web_server_process_extra_arguments_custom }}"
static_web_server_process_extra_arguments_auto: []
static_web_server_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
static_web_server_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
static_web_server_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
static_web_server_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
static_web_server_http_header_permissions_policy: "{{ 'interest-cohort=()' if static_web_server_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
static_web_server_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if static_web_server_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `static_web_server_http_header_permissions_policy`
static_web_server_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `static_web_server_http_header_strict_transport_security`
static_web_server_hsts_preload_enabled: false

# List of systemd services that the Static Web Server systemd service depends on
static_web_server_systemd_required_services_list: "{{ static_web_server_systemd_required_services_list_default + static_web_server_systemd_required_services_list_auto + static_web_server_systemd_required_services_list_custom }}"
static_web_server_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
static_web_server_systemd_required_services_list_auto: []
static_web_server_systemd_required_services_list_custom: []

# List of systemd services that the Static Web Server systemd service wants
static_web_server_systemd_wanted_services_list: "{{ static_web_server_systemd_wanted_services_list_default + static_web_server_systemd_wanted_services_list_auto + static_web_server_systemd_wanted_services_list_custom }}"
static_web_server_systemd_wanted_services_list_default: []
static_web_server_systemd_wanted_services_list_auto: []
static_web_server_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
static_web_server_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
static_web_server_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
static_web_server_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
static_web_server_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ static_web_server_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ static_web_server_container_stop_grace_time_seconds }} {{ static_web_server_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ static_web_server_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ static_web_server_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ static_web_server_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ static_web_server_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ static_web_server_identifier }} after {{ static_web_server_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
static_web_server_environment_variables_tz: UTC

# Specify a logging level
# Valid values: debug, error, info, trace, warn
static_web_server_environment_variables_server_log_level: info

static_web_server_environment_variables_server_root: /public

# Control if the /metrics endpoint that exposes Prometheus metrics is enabled
static_web_server_environment_variables_server_metrics: false

# Additional environment variables.
static_web_server_environment_variables_additional_variables: ""

# static_web_server_restart_necessary controls whether the Static Web Server systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed,
# or whether the running container was created from an older configuration or image.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
static_web_server_restart_necessary: false
